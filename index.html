<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- ====================================================================
         VERSION CONTROL - ALSO DONE IN "script.js"
         ====================================================================
         bump SITE_VERSION any time styles.css, script.js, or a file inside
         /assets is changed. every reference to those files below appends
         "?v=<SITE_VERSION>" as a query string, so the browser treats it as a new URL and 
         re-downloads it instead of serving a stale cached copy. no filenames are ever renamed,
         this and script.js SITE_VERSION are only lines to edit. -->
    <script>
        window.SITE_VERSION = "1.0.4";
    </script>

    <!-- the stylesheet and favicon are injected with document.write so they
         still load synchronously in <head>, in their original position,
         exactly like a normal <link> tag would -->
    <script>
        document.write('<link rel="stylesheet" href="styles.css?v=' + window.SITE_VERSION + '">');
        document.write('<link rel="icon" type="image/png" href="assets/images/Tab_Logo.png?v=' + window.SITE_VERSION + '">');
        document.write('<link rel="shortcut icon" type="image/png" href="assets/images/Tab_Logo.png?v=' + window.SITE_VERSION + '">');
    </script>
    <!-- fallback so the page still renders styled if javascript is disabled
         (content itself already depends entirely on script.js either way) -->
    <noscript><link rel="stylesheet" href="styles.css"></noscript>

    <!-- google fonts: inter for body, space grotesk for headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body>

    <!-- ==================== navigation bar ==================== -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <!-- portfolio branding text -->
            <a href="#" class="nav-brand" data-key="brand"></a>

            <!-- desktop navigation links, hidden on mobile -->
            <ul class="nav-links" id="navLinks">
                <li><a href="#about" class="nav-link" data-key="nav_about"></a></li>
                <li><a href="#skills" class="nav-link" data-key="nav_skills"></a></li>
                <li><a href="#projects" class="nav-link" data-key="nav_projects"></a></li>
                <li><a href="#contact" class="nav-link" data-key="nav_contact"></a></li>
            </ul>

            <!-- controls group: theme toggle + language switcher -->
            <div class="nav-controls">
                <!-- theme toggle button: switches between dark and light mode -->
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="toggle dark or light theme">
                    <!-- sun icon for dark mode (click to go light) -->
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <!-- moon icon for light mode (click to go dark) -->
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>

                <!-- language toggle switcher between english and georgian -->
                <div class="lang-switcher">
                    <button class="lang-btn active" data-lang="en" onclick="switchLanguage('en')">EN</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-btn" data-lang="ka" onclick="switchLanguage('ka')">KA</button>
                </div>
            </div>

            <!-- hamburger menu toggle for mobile viewport -->
            <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()" aria-label="toggle navigation menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>

        <!-- mobile dropdown menu, toggled via javascript -->
        <div class="mobile-menu" id="mobileMenu">
            <ul class="mobile-nav-links">
                <li><a href="#about" class="nav-link" onclick="closeMobileMenu()" data-key="nav_about"></a></li>
                <li><a href="#skills" class="nav-link" onclick="closeMobileMenu()" data-key="nav_skills"></a></li>
                <li><a href="#projects" class="nav-link" onclick="closeMobileMenu()" data-key="nav_projects"></a></li>
                <li><a href="#contact" class="nav-link" onclick="closeMobileMenu()" data-key="nav_contact"></a></li>
            </ul>
        </div>
    </nav>

    <!-- ==================== hero / profile section ==================== -->
    <section class="hero" id="hero">
        <div class="hero-container">
            <!-- profile image container with decorative ring -->
            <div class="profile-image-wrapper">
                <div class="profile-image-ring"></div>
                <img data-src="assets/images/my_image.jpg" alt="profile photo" class="profile-image" id="profileImage">
            </div>

            <!-- profile text content -->
            <div class="hero-content">
                <p class="hero-subtitle" data-key="hero_subtitle"></p>
                <h1 class="hero-title" data-key="hero_title"></h1>
                <p class="hero-description" data-key="hero_desc"></p>
                <a href="#contact" class="cta-button" data-key="cta_touch"></a>
            </div>
        </div>
        <!-- decorative background gradient blob -->
        <div class="hero-blob"></div>
    </section>

    <!-- ==================== about section: education & experience ==================== -->
    <section class="about" id="about">
        <div class="section-container">
            <div class="section-header">
                <span class="section-tag" data-key="about_tag"></span>
                <h2 class="section-title" data-key="about_title"></h2>
                <div class="section-line"></div>
            </div>

            <div class="about-grid">
                <!-- education column -->
                <div class="about-card">
                    <div class="about-card-header">
                        <div class="about-icon education-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                                <path d="M6 12v5c0 2 3 4 6 4s6-2 6-4v-5"/>
                            </svg>
                        </div>
                        <h3 data-key="edu_title"></h3>
                    </div>
                    <div class="about-content" data-key="edu_content">
                    </div>
                </div>

                <!-- experience column -->
                <div class="about-card">
                    <div class="about-card-header">
                        <div class="about-icon experience-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="20" height="14" rx="2"/>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                            </svg>
                        </div>
                        <h3 data-key="exp_title"></h3>
                    </div>
                    <div class="about-content" data-key="exp_content">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== skills section: skills & general knowledge ==================== -->
    <section class="skills" id="skills">
        <div class="section-container">
            <div class="section-header">
                <span class="section-tag" data-key="skills_tag"></span>
                <h2 class="section-title" data-key="skills_title"></h2>
                <div class="section-line"></div>
            </div>

            <div class="skills-wrapper">
                <!-- skills category: technical skills -->
                <div class="skills-category">
                    <h3 class="skills-category-title" data-key="tech_skills_title"></h3>
                    <div class="skills-grid" id="technicalSkills">
                        <!-- skill items populated via javascript for cleaner html structure -->
                    </div>
                </div>

                <!-- skills category: general knowledge -->
                <div class="skills-category">
                    <h3 class="skills-category-title" data-key="gen_know_title"></h3>
                    <div class="skills-grid" id="generalSkills">
                        <!-- skill items populated via javascript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==================== projects section ==================== -->
    <section class="projects" id="projects">
        <div class="section-container">
            <div class="section-header">
                <span class="section-tag" data-key="projects_tag"></span>
                <h2 class="section-title" data-key="projects_title"></h2>
                <div class="section-line"></div>
            </div>

            <!-- projects grid: 7 project cards in responsive grid layout -->
            <div class="projects-grid" id="projectsGrid">
                <!-- project cards generated by javascript to keep html clean and maintainable -->
            </div>
        </div>
    </section>

    <!-- ==================== contact section ==================== -->
    <section class="contact" id="contact">
        <div class="section-container">
            <div class="section-header">
                <span class="section-tag" data-key="contact_tag"></span>
                <h2 class="section-title" data-key="contact_title"></h2>
                <div class="section-line"></div>
            </div>

            <div class="contact-grid">
                <!-- phone contact card -->
                <a href="tel:+995577950733" class="contact-card">
                    <div class="contact-icon-wrapper phone-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                    </div>
                    <h3 data-key="contact_phone"></h3>
                    <p class="contact-detail">+995 577 95 07 33</p>
                </a>

                <!-- email contact card -->
                <a href="mailto:giorgiglonti98743@gmail.com" class="contact-card">
                    <div class="contact-icon-wrapper email-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </div>
                    <h3 data-key="contact_email"></h3>
                    <p class="contact-detail" style="font-size: 14px;">giorgiglonti98743@gmail.com</p>
                </a>

                <!-- location contact card -->
                <div class="contact-card">
                    <div class="contact-icon-wrapper location-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </div>
                    <h3 data-key="contact_location"></h3>
                    <p class="contact-detail" data-key="location_detail"></p>
                </div>

                <!-- github contact card -->
                <a href="https://github.com/Lelouc01101000" target="_blank" rel="noopener noreferrer" class="contact-card">
                    <div class="contact-icon-wrapper github-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </div>
                    <h3 data-key="contact_github"></h3>
                    <p class="contact-detail">Lelouc01101000</p>
                </a>
            </div>
        </div>
    </section>

    <!-- ==================== video modal for project demonstrations ==================== -->
    <div class="video-modal" id="videoModal">
        <div class="modal-overlay" onclick="closeVideoModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeVideoModal()" aria-label="close video modal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <video id="modalVideo" controls preload="none">
                your browser does not support the video tag.
            </video>
            <div class="modal-footer">
                <h3 class="modal-title" id="modalTitle"></h3>
                <div class="speed-control" id="speedControl" role="group" aria-label="playback speed">
                    <button type="button" class="speed-btn" data-speed="0.5">0.5×</button>
                    <button type="button" class="speed-btn" data-speed="0.75">0.75×</button>
                    <button type="button" class="speed-btn active" data-speed="1">1×</button>
                    <button type="button" class="speed-btn" data-speed="1.5">1.5×</button>
                    <button type="button" class="speed-btn" data-speed="2">2×</button>
                </div>
            </div>
        </div>
    </div>

    <!-- skill tooltip element, positioned absolutely via javascript -->
    <div class="skill-tooltip" id="skillTooltip"></div>

    <!-- scroll to top button, appears after scrolling down -->
    <button class="scroll-top" id="scrollTop" onclick="scrollToTop()" aria-label="scroll to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <!-- injected via document.write so it can carry the same ?v= cache-busting
         query string as the stylesheet, from the single SITE_VERSION defined
         in <head> -->
    <script>
        document.write('<script src="script.js?v=' + window.SITE_VERSION + '"><\/script>');
    </script>
</body>
</html>
